spring:
  application:
    name : NutriChefAI
  datasource:
    url : ${DB_URL}
    username : ${DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        type:
          preferred_jsonb_type: org.hibernate.type.JsonBinaryType
    open-in-view: false

server:
  port : 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    com.ai.SpringAIProject: DEBUG

# JWT Configuration
jwt:
  secret: YourSuperSecretKeyForJWT256BitsLongMinimumForHS256AlgorithmSecurityProductionKeyGoesHere
  expiration: 900000  # 15 minutes
  refresh-expiration: 604800000  # 7 days
